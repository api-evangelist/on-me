aid: on-me
name: On Me
description: 'On Me is a San Francisco digital gifting company that sells wallet-native,
  multi-brand eGift cards organised by hobby and interest rather than by single retailer.
  Founded by former Google product managers Darragh Meaney and Sitar Harel, it emerged
  from stealth in December 2024 with a five-year Mastercard partnership and $1.7M in
  pre-seed funding led by Lerer Hippeau and Focal VC. Recipients add a gift to Apple
  Wallet or Google Wallet and tap to pay across a curated category of brands, and senders
  can attach photos, video and GIFs. A business portal supports corporate gifting,
  campaigns and bulk sends. On Me markets a forthcoming Gifting API for programmatic
  rewards, incentives and webhooks, but as of this pass no public API reference, base
  URL, or machine-readable specification is published — access runs through a "talk to
  a specialist" sales conversation.'
